<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>手繪桿件拉張整體模擬器</title>
<style>
  :root{ --bg:#fafaf7; --ink:#222; --muted:#666; --line:#dcdcd2; --accent:#2563eb; --warn:#dc2626; --ok:#15803d; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);}

  /* ---- 登入畫面 ---- */
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card{width:100%;max-width:390px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px;box-shadow:0 8px 28px rgba(0,0,0,.07);}
  .card h1{margin:0 0 4px;font-size:18px;font-weight:600;line-height:1.35;}
  .card .sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  label{display:block;font-size:13px;margin:12px 0 5px;font-weight:500;}
  input[type=text]{width:100%;padding:9px 11px;font-size:15px;border:1px solid var(--line);border-radius:6px;font-family:inherit;background:#fff;}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  #f-sid{letter-spacing:.08em;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:400;margin:14px 0 0;}
  .chk input{margin:0;}
  button.go{width:100%;margin-top:16px;padding:11px 14px;font-size:14px;font-weight:600;border:none;border-radius:7px;background:var(--ink);color:#fff;cursor:pointer;font-family:inherit;}
  button.go:hover:not(:disabled){opacity:.87;}
  button.go:disabled{opacity:.5;cursor:default;}
  #msg{margin-top:13px;font-size:12.5px;line-height:1.6;min-height:1.2em;}
  #msg.err{color:var(--warn);}
  #msg.ok{color:var(--ok);}
  #msg.busy{color:var(--muted);}
  .foot{margin-top:16px;padding-top:13px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.6;}

  /* ---- 登入後 ---- */
  #shell{position:fixed;inset:0;display:flex;flex-direction:column;}
  #bar{flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;height:34px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);}
  #bar .name{color:var(--ink);font-weight:600;}
  #bar .spacer{margin-left:auto;}
  #bar button{padding:3px 10px;font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-family:inherit;color:var(--muted);}
  #bar button:hover{background:#f3f3ec;color:var(--ink);}
  #bar #roleBadge{background:#1f2937;color:#fff;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.06em;}
  #bar #diagBtn{font-size:11px;}
  #diagPanel{position:fixed;right:12px;top:40px;z-index:50;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.75;color:var(--ink);
    box-shadow:0 8px 28px rgba(0,0,0,.12);max-width:330px;}
  #diagPanel h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
  #diagPanel code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f3f3ec;padding:1px 4px;border-radius:3px;}
  #diagPanel .row{display:flex;justify-content:space-between;gap:14px;}
  #diagPanel .row b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;}
  #bar #popout{color:var(--warn);text-decoration:none;font-size:11.5px;border:1px solid #f3c9c9;background:#fef6f6;padding:2px 8px;border-radius:4px;}
  #bar #popout:hover{text-decoration:underline;}
  #app{flex:1;width:100%;border:0;display:block;min-height:0;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="gate">
  <form class="card" id="loginForm" autocomplete="off" action="#" onsubmit="return false;">
    <h1>手繪桿件拉張整體模擬器</h1>
    <p class="sub">請用選課名單上的姓名與學號登入。</p>

    <label for="f-name">姓名</label>
    <input type="text" id="f-name" autocorrect="off" spellcheck="false" placeholder="與選課名單相同" />

    <label for="f-sid">學號</label>
    <input type="text" id="f-sid" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="與選課系統相同，留意前導零" />

    <label class="chk"><input type="checkbox" id="f-remember" /> 記住這台裝置（下次免輸入）<br>
      <span style="font-size:11px;">只在自己的電腦或手機才勾；共用電腦請不要勾。</span></label>

    <button class="go" type="submit" id="go" disabled>載入中…</button>
    <div id="msg"></div>

    <div class="foot">
      只有修這門課的同學能進入。姓名與學號只在<b>你自己的瀏覽器</b>裡用來解鎖工具，
      <b>不會傳送到任何伺服器</b>。若勾選「記住這台裝置」，姓名與學號會存在這台裝置上，
      下次自動登入 —— 共用電腦請不要勾選。
    </div>
  </form>
</div>

<div id="shell" hidden>
  <div id="bar">
    <span>已登入：<span class="name" id="who"></span></span>
    <span id="roleBadge" hidden>教師</span>
    <a id="popout" href="#" target="_blank" rel="noopener" hidden>⚠️ 在新分頁開啟（畫面較寬、下載才正常）</a>
    <button type="button" id="diagBtn" hidden>診斷</button>
    <span class="spacer"></span>
    <button type="button" id="logout">登出</button>
  </div>
  <iframe id="app" title="工具"></iframe>
</div>

// 不能用 \s：Python 的 \s 含 U+0085／U+001C–1F，JS 的 \s 含 U+FEFF，兩者不等價 ——
// 任何分歧都會讓該名同學永遠登不進去。所以明確列出要剝除的字元。
const STRIP_RE = /[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\u200b\u200c\u200d\u200e\u200f\u2060\ufeff\u00ad\u001c\u001d\u001e\u001f]+/g;
const VS_RE = /[\uFE00-\uFE0F]|\uDB40[\uDD00-\uDDEF]/g;   // 變體選擇符（含 U+E0100–E01EF 的代理對）
const clean = v => (v || '').normalize('NFKC').replace(STRIP_RE, '').replace(VS_RE, '');
const idKey = v => clean(v).toUpperCase();
const nameText = v => clean(v).toLowerCase();

let bundle = null;       // 解密後的 { app, roster, meta }
let fails = 0;

function say(text, cls) { const m = $('msg'); m.textContent = text || ''; m.className = cls || ''; }

async function pbkdf2(secret, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', encText.encode(secret), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, 256);
  return new Uint8Array(bits);
}

// 用「學號 + 姓名」派生包裝金鑰，逐一試開信封；開得了哪一個就拿到主金鑰。
// 信封彼此無法分辨，所以試不開＝不在名單上，連工具內容都拿不到。
async function unlock(name, sid) {
  const bits = await pbkdf2(idKey(sid) + '\n' + nameText(name), b64(PAYLOAD.salt), PAYLOAD.iter);
  const wrapKey = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  let opened = null;
  for (const env of PAYLOAD.keys) {
    try {
      opened = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, wrapKey, b64(env.ct)));
      break;
    } catch (_) { /* 不是這一份，試下一個 */ }
  }
  if (!opened) return null;
  const master = opened.slice(0, 32);
  const role = opened.length > 32 ? opened[32] : 0;      // 0 = 學生、1 = 教師
  const key = await crypto.subtle.importKey('raw', master, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  const bundleObj = JSON.parse(decText.decode(plain));
  bundleObj.role = role;
  return bundleObj;
}

// 被嵌在其他網站的 iframe 裡時，版面會被擠窄、瀏覽器也可能擋下載
function embedded() {
  try { return window.top !== window.self; } catch (_) { return true; }   // 跨來源存取被擋 = 確實被嵌著
}

let diagInfo = null;

function launch(b, displayName) {
  $('who').textContent = displayName;
  if (b.role === 1) {
    $('roleBadge').hidden = false;
    $('diagBtn').hidden = false;
    diagInfo = b;
  }
  if (embedded()) {
    const link = $('popout');
    link.href = location.href;
    link.hidden = false;
  }
  $('gate').hidden = true;
  $('shell').hidden = false;
  $('app').srcdoc = b.app;          // 同源 srcdoc：下載、three.js CDN 都正常
  document.title = PAYLOAD.title || document.title;
}

async function attempt(name, sid, { silent = false } = {}) {
  if (!window.crypto || !crypto.subtle) {
    say('這個瀏覽器環境不支援解密（需要 https 或 localhost）。請用 https 網址開啟，或換 Chrome／Safari／Edge。', 'err');
    return false;
  }
  if (!name.trim() || !sid.trim()) {
    if (!silent) say('請填寫姓名與學號。', 'err');
    return false;
  }
  // 失敗時先顯示訊息，再把按鈕鎖住一段時間：訊息立刻看得到，猜碼也被拖慢
  async function fail(message) {
    fails++;
    say(message, 'err');
    await new Promise(r => setTimeout(r, Math.min(3000, 400 * fails)));
    $('go').disabled = false;
    return false;
  }

  $('go').disabled = true;
  if (!silent) say('驗證中…', 'busy');
  try {
    bundle = await unlock(name, sid);
  } catch (_) { bundle = null; }
  if (!bundle) {
    return await fail('這組姓名與學號打不開。請確認與選課系統完全一致'
                    + '（學號留意前導零、姓名留意異體字）。'
                    + '若你確定資料正確，請按 ⌘⇧R（Windows 為 Ctrl+F5）強制重新整理後再試；'
                    + '仍然不行就是還沒加進名單，請告訴老師。');
  }
  $('go').disabled = false;
  try {
    if ($('f-remember').checked) localStorage.setItem(STORE_KEY, JSON.stringify({ name, sid }));
    else localStorage.removeItem(STORE_KEY);
  } catch (_) { /* 無痕模式不給存，略過 */ }
  launch(bundle, name.trim());
  return true;
}

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  attempt($('f-name').value, $('f-sid').value);
});

// 教師用的現場診斷：同學說「登不進去」時，先確認大家看到的是不是同一版
$('diagBtn').addEventListener('click', async () => {
  const old = document.getElementById('diagPanel');
  if (old) { old.remove(); return; }
  const el = document.createElement('div');
  el.id = 'diagPanel';
  el.innerHTML = '<h4>診斷</h4><div class="row"><span>讀取中…</span></div>';
  document.body.appendChild(el);
  let live = null;
  try {
    const res = await fetch('version.json', { cache: 'no-store' });
    if (res.ok) live = await res.json();
  } catch (_) { /* 離線 */ }
  const same = live && live.id === PAYLOAD.id;
  const n = (diagInfo && diagInfo.meta && diagInfo.meta.count) || '?';
  el.innerHTML =
    '<h4>診斷</h4>' +
    `<div class="row"><span>這個分頁的版本</span><b>${PAYLOAD.id}</b></div>` +
    `<div class="row"><span>伺服器上的版本</span><b>${live ? live.id : '讀不到'}</b></div>` +
    `<div class="row"><span>名單人數</span><b>${n}</b></div>` +
    `<div class="row"><span>建置時間</span><b>${live && live.built ? live.built.replace('T', ' ').slice(0, 16) : '—'}</b></div>` +
    `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);">` +
      (same
        ? '✅ 版本一致。同學若登不進去，就是<b>姓名或學號跟名單不同</b>（留意前導零與異體字），請更新名單重新部署。'
        : '⚠️ 這個分頁是舊版。請按 <code>⌘⇧R</code> 重新整理；同學那邊也一樣。') +
    '</div>';
});

$('logout').addEventListener('click', () => {
  try { localStorage.removeItem(STORE_KEY); } catch (_) { /* 略過 */ }
  location.reload();
});

// 版本檢查：GitHub Pages 的 HTML 會被快取 10 分鐘，開著的分頁更是永遠不會更新。
// 名單換了而使用者拿到舊頁，會變成「資料明明正確卻登不進去」。這裡主動比對並換成新版。
(async function checkVersion() {
  try {
    const res = await fetch('version.json', { cache: 'no-store' });
    if (!res.ok) return;
    const v = await res.json();
    if (!v || !v.id || v.id === PAYLOAD.id) return;
    if (sessionStorage.getItem('sts-reloaded') === v.id) return;   // 同一版只重載一次，避免無限迴圈
    sessionStorage.setItem('sts-reloaded', v.id);
    location.replace(location.pathname + '?v=' + encodeURIComponent(v.id));
  } catch (_) { /* 離線或用 file:// 開啟：略過 */ }
})();

// payload 有 100KB 以上，慢速網路下使用者可能在 JS 就緒前就按下送出。
// 按鈕在 HTML 裡預設停用，到這裡才啟用。
$('go').disabled = false;
$('go').textContent = '進入工具';

// 這台裝置記住過就自動進入
(async function autoLogin() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) { saved = null; }
  if (!saved || !saved.sid) { $('f-name').focus(); return; }
  $('f-name').value = saved.name || ''; $('f-sid').value = saved.sid || '';
  say('登入中…', 'busy');
  const ok = await attempt(saved.name, saved.sid, { silent: true });
  if (!ok) { try { localStorage.removeItem(STORE_KEY); } catch (_) { /* 略過 */ } say('請重新登入。', ''); $('f-name').focus(); }
})();
</script>
